<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="银幕指南：从电影、观众与共同署名，认识导演。">
  <title>导演与作品 · 银幕指南</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="导演.css">
</head>
<body>
  <div class="film-rail rail-left" aria-hidden="true"></div>
  <div class="film-rail rail-right" aria-hidden="true"></div>
  <header class="masthead">
    <a class="brand" href="index.html">银幕指南</a>
  </header>

  <main class="page">
    <section class="cover" aria-labelledby="cover-title">
      <div class="cover-type">
        <h1 id="cover-title">导演<br>与作品</h1>
        <p class="cover-line">一部电影背后，站着谁。</p>
        <p class="cover-meta" id="cover-meta"></p>
      </div>
      <div class="cover-art" id="cover-art"></div>
    </section>

    <section class="story" id="volume">
      <h2><span id="single-share"></span> 的导演，在库内只有一部作品</h2>
      <div class="data-spread">
        <figure class="screen-card"><div class="chart chart-volume" data-chart="C1" role="img" aria-label="导演作品数分布，每个完整电影帧代表百分之一"></div><div class="unit-key">▰ 1%</div><ul class="volume-legend" id="volume-legend"></ul></figure>
        <figure class="screen-card rank-panel"><h3>产量 · 前十</h3><div class="chart ranking" data-chart="R1" role="img" aria-label="库内产量前十导演，棒棒糖榜单"></div></figure>
      </div>
    </section>

    <section class="story" id="career">
      <h2>作品年历</h2>
      <div class="screen-card chronicle-explorer">
        <header class="chronicle-toolbar">
          <p id="chronicle-total">正在载入年历…</p>
          <div class="chronicle-search"><input id="chronicle-search" type="search" placeholder="搜索导演，查看年历" aria-label="搜索年历导演" autocomplete="off" disabled><div id="chronicle-results" class="collaboration-results" role="listbox" aria-label="年历导演搜索结果" hidden></div></div>
          <label class="chronicle-step">每格<select id="chronicle-step" aria-label="切换年历时间粒度" disabled><option value="1">1 年</option><option value="5" selected>5 年</option><option value="10">10 年</option></select></label>
        </header>
        <div class="chronicle" id="chronicle-view"><div class="chronicle-people" id="chronicle-people"></div><figure class="chronicle-track"><div class="chart chart-career" data-chart="C6" role="img" aria-label="导演完整作品年历，可搜索切换导演和时间粒度，点击时间格查看该时段片单"></div></figure></div>
        <p id="chronicle-empty" class="chronicle-empty" hidden>这些作品暂无上映年份</p>
        <section class="chronicle-filmography" aria-label="年历时段作品">
          <header><h3 id="chronicle-period-name">全部作品</h3><span id="chronicle-period-count"></span><button id="chronicle-all" type="button" hidden disabled>全部作品</button></header>
          <div id="chronicle-period-films" class="collaboration-filmstrip"></div>
        </section>
      </div>
    </section>

    <section class="story film-feature" id="films">
      <div class="section-heading"><h2 id="feature-name"></h2><select id="feature-selector" aria-label="切换导演"></select></div>
      <div class="screen-card feature-layout">
        <div class="feature-portrait" id="feature-portrait"></div>
        <div class="film-grid" id="feature-films"></div>
      </div>
      <div class="feature-footer"><button class="text-button" id="feature-more" type="button">全部作品 ↗</button></div>
    </section>

    <section class="story" id="genres">
      <h2>同一位导演，不止一种故事</h2>
      <figure class="screen-card genre-card"><div class="genre-track"><div class="chart chart-genres" data-chart="C7" role="img" aria-label="十二位导演与十二种类型的气泡矩阵，各列颜色区分电影类型，圆面积表示标签占比，浅色描边表示行内最高，短横线表示未出现；悬停查看具体占比"></div></div></figure>
    </section>

    <section class="story" id="attention">
      <h2>少数导演，多数目光</h2>
      <div class="data-spread attention-spread">
        <figure class="screen-card attention-card">
          <div class="attention-summary"><div><strong class="attention-head">1%</strong><span id="attention-directors"></span></div><div><strong class="attention-records" id="attention-share"></strong><span id="attention-records"></span></div></div>
          <div class="chart chart-attention" data-chart="C2" role="img" aria-label="单张百分格叠加：金框一格表示前百分之一导演，红色表示他们获得的百分之七十点六评分记录；两者分母不同"></div>
          <div class="attention-key"><span><i class="head-key"></i>前 1% 导演</span><span><i class="record-key"></i>评分记录</span><span>▰ 1%</span></div>
        </figure>
        <figure class="screen-card rank-panel attention-ranking"><div class="attention-ranking-heading"><h3>关注度 · 前十</h3><span>作品数 · 加权均分</span></div><div class="chart ranking" data-chart="R2" role="img" aria-label="评分记录前十导演，棒棒糖表示评分记录，姓名下显示作品数与加权均分"></div></figure>
      </div>
    </section>

    <section class="story" id="distribution">
      <h2>作品与口碑</h2>
      <figure class="screen-card distribution-card"><div class="plot-key"><span><i class="median-key"></i>中位数</span><span><i class="range-key"></i>中间 50%</span></div><div class="chart chart-distribution" data-chart="C3" role="img" aria-label="四组导演均分密度轮廓，短虚线为中位数"></div></figure>
      <figure class="screen-card rank-panel score-ranking" id="score-ranking"><h3>作品均分 · 前十</h3><div class="score-comparison-track" tabindex="0" aria-label="三轴对比，窄屏可左右滚动"><div class="chart ranking" data-chart="R3" role="img" aria-label="高分前十导演的三轴平行坐标图，每条线连接同一导演的加权均分、作品数与评分记录；口碑轴显示四分至四点三分的局部范围；悬停精读，点击进入导演探索"></div></div></figure>
    </section>

    <section class="story" id="audience">
      <h2>高分，少些目光</h2>
      <figure class="screen-card discovery-frame"><div class="chart chart-discovery" data-chart="C4" role="img" aria-label="高分导演发现图：全部导演为背景，突出均分至少四分且评分记录低于群体中位数的导演；右侧列出姓名、均分、记录量与作品数，点击进入导演探索"></div></figure>
    </section>

    <section class="story" id="collaboration">
      <h2>共同署名</h2>
      <div class="screen-card collab-feature" id="collab-feature"></div>
      <figure class="screen-card collaboration-explorer">
        <header class="collaboration-heading"><div><h3 id="collab-focus">全部合作</h3><p id="collab-total"></p></div>
          <div class="collaboration-search"><input id="collab-search" type="search" placeholder="搜索导演" aria-label="搜索合作导演" autocomplete="off" disabled><div id="collab-results" class="collaboration-results" role="listbox" aria-label="合作导演搜索结果" hidden></div></div>
        </header>
        <div class="collaboration-actions"><span id="collab-partner-count"></span><button id="collab-works" type="button" disabled>导演作品 ↗</button><div class="collaboration-zoom"><button type="button" data-collab-zoom="in" aria-label="放大合作图" disabled>＋</button><button type="button" data-collab-zoom="out" aria-label="缩小合作图" disabled>－</button><button type="button" data-collab-zoom="reset" disabled>复位</button></div></div>
        <div class="collaboration-stage"><div class="chart chart-collab" data-chart="C5" role="img" aria-label="全部合作探索图，搜索导演后查看他的全部搭档，点击搭档继续浏览，点击连线查看合作影片，可拖动和缩放"></div><p id="collab-loading" class="collaboration-loading" role="status">正在载入合作关系…</p></div>
        <section class="collaboration-filmography" aria-label="合作影片"><header><div><h3 id="collab-pair-name"></h3><p id="collab-pair-count"></p></div><select id="collab-partner" aria-label="选择全部合作搭档" disabled></select></header><div id="collab-pair-films" class="collaboration-filmstrip"></div></section>
      </figure>
    </section>

    <section class="story explore-section" id="explore" aria-labelledby="explore-title">
      <h2 id="explore-title">再认识一位导演</h2>
      <div class="explore-panel" id="director-explorer">
    <div class="search-shell">
      <header class="search-bar">
        <span class="explore-brand">导演探索</span>
        <div class="search-field"><input id="search-input" type="search" placeholder="搜索导演或电影" autocomplete="off" aria-label="搜索导演或片名"></div>
      </header>
      <p class="search-status" id="search-status" role="status" hidden></p>
      <div class="search-workspace">
        <aside class="search-sidebar">
          <div class="search-scope" id="search-scope" aria-label="搜索对象"><button type="button" data-scope="director" aria-pressed="true">导演</button><button type="button" data-scope="film" aria-pressed="false">电影</button></div>
          <div class="search-results" id="search-results" aria-label="搜索结果"></div>
          <section class="saved-panel"><h3>我的导演</h3><div id="saved-directors"></div></section>
        </aside>
        <section class="detail-view" id="detail-view" hidden aria-label="导演与作品">
          <div class="browse-toolbar"><p class="browse-state" id="browse-state"></p><button class="save-button" id="save-director" type="button">＋ 收进导演架</button></div><div id="profile-content"></div>
          <section class="comparison" id="comparison-section" hidden><div class="comparison-heading"><h3>导演对比</h3><button class="text-button" id="clear-compare" type="button">清除对比</button></div><div class="compare-panel" id="compare-panel"></div></section>
          <div class="film-grid profile-films" id="director-films"></div>
          <section class="film-inspector" id="film-inspector" hidden aria-label="电影详情">
            <div id="film-content"></div>
            <h3>观众逐星评分</h3><p id="film-rating-empty" hidden>暂无评分记录</p>
            <div class="film-rating-chart" id="film-rating-chart" role="img" aria-label="单部电影从零点五分到五分的十档评分记录数"></div>
          </section>
          <a class="text-button return-page" href="#cover-title">回到片头 ↑</a>
        </section>
        <aside class="explore-insights" id="explore-insights" hidden aria-label="导演可视化">
          <div class="insight-toolbar"><h3 id="insight-director"></h3></div>
          <div class="insight-scope"><button type="button" data-insight-scope="current" aria-pressed="true">当前导演</button><button type="button" data-insight-scope="comparison" aria-pressed="false" disabled>主导演对比</button></div>
          <div class="cohort-legend" id="cohort-legend"></div>
          <section id="study-selection" class="study-selection" aria-label="已选作品" hidden><div class="study-selection-heading"><span id="study-selection-count"></span><button id="study-clear" type="button">清除选择</button></div><h4 id="study-selection-title"></h4><div id="study-selected-films" class="study-selected-films"></div><div class="study-selection-actions"><button id="study-view-film" type="button">查看影片</button><button id="study-view-director" type="button" hidden>查看导演</button></div></section>
          <section class="insight" data-insight="ratings"><header class="insight-heading"><h3>口碑光谱</h3><div class="view-switch" role="group" aria-label="切换口碑光谱视角"><button type="button" data-chart-mode="ratings" data-mode-value="0" aria-pressed="true">口碑范围</button><button type="button" data-chart-mode="ratings" data-mode-value="1" aria-pressed="false">评分门槛</button></div><button class="zoom-button" type="button" data-zoom="ratings" aria-label="放大口碑光谱"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 7V2h5m6 0h5v5M18 13v5h-5M7 18H2v-5"/></svg></button></header><div class="insight-controls"><label id="threshold-control" class="study-range" hidden>评分 ≥ <output id="rating-threshold-value">4.00</output><input id="rating-threshold" aria-label="调整评分门槛" type="range" min="0.5" max="5" step="0.05" value="4"></label></div><p class="insight-metric" id="metric-ratings"></p><p class="insight-empty" id="empty-ratings" hidden></p><div class="insight-plot-track"><div class="analysis-chart" id="analysis-ratings" role="img" aria-label="口碑光谱可视化"></div></div></section>
          <section class="insight" data-insight="career"><header class="insight-heading"><h3>发行轨迹</h3><div class="view-switch" role="group" aria-label="切换发行轨迹视角"><button type="button" data-chart-mode="career" data-mode-value="0" aria-pressed="true">海报时间轴</button><button type="button" data-chart-mode="career" data-mode-value="1" aria-pressed="false">发行间隔</button></div><button class="zoom-button" type="button" data-zoom="career" aria-label="放大发行轨迹"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 7V2h5m6 0h5v5M18 13v5h-5M7 18H2v-5"/></svg></button></header><div class="insight-controls"><div id="career-metric-control" class="metric-switch" role="group" aria-label="时间轴显示指标"><button type="button" data-career-metric="mean" aria-pressed="true">均分</button><button type="button" data-career-metric="votes" aria-pressed="false">评分记录</button></div></div><p class="insight-metric" id="metric-career"></p><p class="insight-empty" id="empty-career" hidden></p><div class="insight-plot-track"><div class="analysis-chart" id="analysis-career" role="img" aria-label="发行轨迹可视化"></div></div></section>
          <section class="insight" data-insight="partners"><header class="insight-heading"><h3>共同署名</h3><div class="view-switch" role="group" aria-label="切换共同署名视角"><button type="button" data-chart-mode="partners" data-mode-value="0" aria-pressed="true">影片与导演</button><button type="button" data-chart-mode="partners" data-mode-value="1" aria-pressed="false">搭档和弦</button></div><button class="zoom-button" type="button" data-zoom="partners" aria-label="放大共同署名"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 7V2h5m6 0h5v5M18 13v5h-5M7 18H2v-5"/></svg></button></header><div class="insight-controls"><select id="study-partner" aria-label="定位署名导演"><option value="">定位署名导演</option></select></div><p class="insight-metric" id="metric-partners"></p><p class="insight-empty" id="empty-partners" hidden></p><div class="insight-plot-track"><div class="analysis-chart" id="analysis-partners" role="img" aria-label="共同署名可视化"></div></div></section>
          <section class="insight" data-insight="genres"><header class="insight-heading"><h3>类型变化</h3><div class="view-switch" role="group" aria-label="切换类型变化视角"><button type="button" data-chart-mode="genres" data-mode-value="0" aria-pressed="true">类型构成</button><button type="button" data-chart-mode="genres" data-mode-value="1" aria-pressed="false">年代变化</button></div><button class="zoom-button" type="button" data-zoom="genres" aria-label="放大类型变化"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 7V2h5m6 0h5v5M18 13v5h-5M7 18H2v-5"/></svg></button></header><div class="insight-controls"><label id="genre-period-control" hidden>每格 <select id="genre-period" aria-label="切换类型年代粒度"><option value="1">1 年</option><option value="5" selected>5 年</option><option value="10">10 年</option></select></label></div><p class="insight-metric" id="metric-genres"></p><p class="insight-empty" id="empty-genres" hidden></p><div class="insight-plot-track"><div class="analysis-chart" id="analysis-genres" role="img" aria-label="类型变化可视化"></div></div></section>
        </aside>
      </div>
    </div>
      </div>
    </section>

  </main>

  <dialog class="chart-dialog" id="chart-dialog" aria-label="放大图表">
    <header class="zoom-heading"><h2 id="zoom-title"></h2><select id="zoom-mode" aria-label="切换放大图形"></select><button class="icon-button" id="close-chart" type="button" aria-label="关闭放大图表">×</button></header>
    <div class="insight-scope"><button type="button" data-insight-scope="current" aria-pressed="true">当前导演</button><button type="button" data-insight-scope="comparison" aria-pressed="false" disabled>主导演对比</button></div>
    <div class="cohort-legend" id="zoom-legend"></div><div id="zoom-selection" class="zoom-selection" hidden><span id="zoom-selected-title"></span><button type="button" id="zoom-view-film">查看影片</button><button type="button" id="zoom-view-director" hidden>查看导演</button></div><p class="insight-metric" id="zoom-metric"></p><p class="insight-empty" id="zoom-empty" hidden></p><div class="zoom-plot-track"><div id="zoom-chart" class="zoom-chart" role="img" aria-label="放大后的导演图表"></div></div>
  </dialog>
  <noscript>请开启 JavaScript 查看导演数据。</noscript>
  <script src="echarts.min.js"></script>
  <script src="vintage.js"></script>
  <script src="导演长页数据.js"></script>
  <script src="导演数据.js"></script>
  <script src="导演长页图表.js"></script>
  <script src="导演浮层模板.js"></script>
  <script src="导演页.js"></script>
</body>
</html>
